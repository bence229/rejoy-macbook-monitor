name: Rejoy MacBook Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Függőségek telepítése
        run: |
          pip install -r requirements.txt

      - name: Rejoy ellenőrzése
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Állapot mentése
        run: |
          git config user.name "Rejoy MacBook Monitor"
          git config user.email "rejoy-monitor@users.noreply.github.com"

          git add seen_products.json

          if git diff --cached --quiet; then
            echo "Nincs új állapotváltozás."
          else
            git commit -m "Update Rejoy monitor state"
            git push
          fi
